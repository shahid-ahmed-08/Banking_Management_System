<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahid National Bank Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 28, 47, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .auth-status {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex-grow: 1;
        }

        /* Glassmorphic Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        /* Metrics grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            text-align: center;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 0.5rem;
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Forms Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 1rem;
            border-bottom: 2px solid var(--border-color);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-savings { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge-current { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge-fixed { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        /* Dialogs and Alerts */
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: none;
        }

        .alert-success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .alert-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }

        /* Login Container Overlay */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
        }

        .hide {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="loginOverlay" class="login-overlay">
        <div class="card login-card">
            <h2 style="margin-bottom: 1.5rem; text-align: center;" class="logo">Shahid National Bank</h2>
            <div id="loginAlert" class="alert alert-danger"></div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Operator Username</label>
                    <input type="text" id="username" required placeholder="e.g., admin">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">Authenticate</button>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">🏦 Shahid National Bank Portal</div>
        <div class="auth-status">
            <span id="operatorRole" class="badge badge-savings" style="text-transform: capitalize;">Role: -</span>
            <button onclick="handleLogout()" class="btn btn-secondary">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- Global alerts -->
        <div id="globalSuccess" class="alert alert-success"></div>
        <div id="globalError" class="alert alert-danger"></div>

        <!-- Metrics Dashboard -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Active Accounts</div>
                <div id="metricAccounts" class="metric-value">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Server Uptime</div>
                <div id="metricUptime" class="metric-value">0s</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Active Session Operator</div>
                <div id="metricPrincipal" class="metric-value" style="font-size: 1.5rem; line-height: 2rem;">-</div>
            </div>
        </div>

        <!-- Main section layout -->
        <div class="form-grid">
            
            <!-- Left Side: Account Registration & Operations -->
            <div>
                <!-- Create Account -->
                <div class="card">
                    <div class="card-title">Create Customer Account</div>
                    <form id="createAccountForm" onsubmit="handleCreateAccount(event)">
                        <div class="form-group">
                            <label for="customerName">Full Name</label>
                            <input type="text" id="customerName" required placeholder="e.g., Jane Doe">
                        </div>
                        <div class="form-group">
                            <label for="accountType">Account Type</label>
                            <select id="accountType" required>
                                <option value="savings">Savings Account (4% Int, Min 1,000)</option>
                                <option value="current">Current Account (10k Overdraft)</option>
                                <option value="fixed">Fixed Deposit Account (Maturity rule)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="initialDeposit">Initial Deposit</label>
                            <input type="number" id="initialDeposit" min="0" step="0.01" required placeholder="e.g., 2000.00">
                        </div>
                        <button type="submit" class="btn btn-primary">Open Account</button>
                    </form>
                </div>

                <!-- Operations Drawer -->
                <div class="card">
                    <div class="card-title">Account Transaction Operations</div>
                    <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
                        <button onclick="switchOpTab('deposit')" id="tabBtn-deposit" class="btn btn-primary">Deposit</button>
                        <button onclick="switchOpTab('withdraw')" id="tabBtn-withdraw" class="btn btn-secondary">Withdraw</button>
                        <button onclick="switchOpTab('transfer')" id="tabBtn-transfer" class="btn btn-secondary">Transfer</button>
                    </div>

                    <!-- Deposit Form -->
                    <form id="depositForm" onsubmit="handleDeposit(event)">
                        <div class="form-group">
                            <label for="depAccount">Account Number</label>
                            <input type="text" id="depAccount" required placeholder="e.g., 100234">
                        </div>
                        <div class="form-group">
                            <label for="depAmount">Deposit Amount</label>
                            <input type="number" id="depAmount" min="0.01" step="0.01" required placeholder="e.g., 500.00">
                        </div>
                        <button type="submit" class="btn btn-primary">Execute Deposit</button>
                    </form>

                    <!-- Withdraw Form -->
                    <form id="withdrawForm" onsubmit="handleWithdraw(event)" class="hide">
                        <div class="form-group">
                            <label for="withAccount">Account Number</label>
                            <input type="text" id="withAccount" required placeholder="e.g., 100234">
                        </div>
                        <div class="form-group">
                            <label for="withAmount">Withdrawal Amount</label>
                            <input type="number" id="withAmount" min="0.01" step="0.01" required placeholder="e.g., 250.00">
                        </div>
                        <button type="submit" class="btn btn-primary">Execute Withdrawal</button>
                    </form>

                    <!-- Transfer Form -->
                    <form id="transferForm" onsubmit="handleTransfer(event)" class="hide">
                        <div class="form-group">
                            <label for="transSource">Source Account Number</label>
                            <input type="text" id="transSource" required placeholder="e.g., 100234">
                        </div>
                        <div class="form-group">
                            <label for="transTarget">Destination Account Number</label>
                            <input type="text" id="transTarget" required placeholder="e.g., 100235">
                        </div>
                        <div class="form-group">
                            <label for="transAmount">Transfer Amount</label>
                            <input type="number" id="transAmount" min="0.01" step="0.01" required placeholder="e.g., 1000.00">
                        </div>
                        <button type="submit" class="btn btn-primary">Execute Transfer</button>
                    </form>
                </div>
            </div>

            <!-- Right Side: Accounts List -->
            <div>
                <div class="card" style="height: 100%;">
                    <div class="card-title">
                        Active Accounts Registry
                        <button onclick="refreshAccounts()" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">Refresh Registry</button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Acc #</th>
                                    <th>Holder Name</th>
                                    <th>Type</th>
                                    <th>Current Balance</th>
                                </tr>
                            </thead>
                            <tbody id="accountsTableBody">
                                <tr>
                                    <td colspan="4" style="text-align: center; color: var(--text-muted);">No accounts loaded. Refresh the registry.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let token = sessionStorage.getItem('token') || '';

        document.addEventListener('DOMContentLoaded', () => {
            if (token) {
                document.getElementById('loginOverlay').classList.add('hide');
                bootstrapDashboard();
            }
        });

        function showGlobalAlert(id, message, isSuccess = true) {
            const el = document.getElementById(id);
            el.innerText = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 6000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertEl = document.getElementById('loginAlert');
            alertEl.style.display = 'none';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                
                const data = await response.json();
                if (data.token) {
                    token = data.token;
                    sessionStorage.setItem('token', token);
                    sessionStorage.setItem('principal', data.principal);
                    sessionStorage.setItem('roles', JSON.stringify(data.roles));
                    
                    document.getElementById('loginOverlay').classList.add('hide');
                    bootstrapDashboard();
                } else {
                    alertEl.innerText = data.error || 'Authentication failed.';
                    alertEl.style.display = 'block';
                }
            } catch (err) {
                alertEl.innerText = 'Unable to connect to the authentication server.';
                alertEl.style.display = 'block';
            }
        }

        function handleLogout() {
            sessionStorage.clear();
            token = '';
            document.getElementById('loginOverlay').classList.remove('hide');
        }

        function bootstrapDashboard() {
            const roles = JSON.parse(sessionStorage.getItem('roles') || '[]');
            document.getElementById('operatorRole').innerText = `Role: ${roles.join(', ')}`;
            
            // Poll metrics and refresh account list
            pollMetrics();
            refreshAccounts();
            setInterval(pollMetrics, 5000);
        }

        async function pollMetrics() {
            if (!token) return;
            try {
                const response = await fetch('/metrics', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.uptimeSeconds !== undefined) {
                    document.getElementById('metricAccounts').innerText = data.accounts;
                    document.getElementById('metricUptime').innerText = `${data.uptimeSeconds}s`;
                    document.getElementById('metricPrincipal').innerText = data.principal;
                }
            } catch (err) {
                console.error('Metrics sync failed.');
            }
        }

        async function refreshAccounts() {
            if (!token) return;
            try {
                const response = await fetch('/accounts', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                const tbody = document.getElementById('accountsTableBody');
                tbody.innerHTML = '';
                
                if (data.accounts && data.accounts.length > 0) {
                    data.accounts.forEach(acc => {
                        const tr = document.createElement('tr');
                        const typeClass = acc.accountType.toLowerCase().includes('savings') ? 'badge-savings' : 
                                          acc.accountType.toLowerCase().includes('current') ? 'badge-current' : 'badge-fixed';
                        tr.innerHTML = `
                            <td style="font-weight: 600;">${acc.accountNumber}</td>
                            <td>${acc.userName}</td>
                            <td><span class="badge ${typeClass}">${acc.accountType}</span></td>
                            <td style="font-weight: 600; color: #60a5fa;">$${parseFloat(acc.balance).toFixed(2)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No accounts found.</td></tr>`;
                }
            } catch (err) {
                console.error('Failed to fetch account registry.');
            }
        }

        async function handleCreateAccount(e) {
            e.preventDefault();
            const name = document.getElementById('customerName').value;
            const type = document.getElementById('accountType').value;
            const deposit = document.getElementById('initialDeposit').value;

            try {
                const response = await fetch('/accounts', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `name=${encodeURIComponent(name)}&type=${encodeURIComponent(type)}&deposit=${encodeURIComponent(deposit)}`
                });

                const data = await response.json();
                if (data.accountNumber) {
                    showGlobalAlert('globalSuccess', `Successfully opened account #${data.accountNumber} for ${data.userName}!`);
                    document.getElementById('createAccountForm').reset();
                    refreshAccounts();
                    pollMetrics();
                } else {
                    showGlobalAlert('globalError', data.error || 'Failed to create account.', false);
                }
            } catch (err) {
                showGlobalAlert('globalError', 'API server unreachable during creation.', false);
            }
        }

        function switchOpTab(tab) {
            ['deposit', 'withdraw', 'transfer'].forEach(op => {
                const form = document.getElementById(`${op}Form`);
                const btn = document.getElementById(`tabBtn-${op}`);
                if (op === tab) {
                    form.classList.remove('hide');
                    btn.className = 'btn btn-primary';
                } else {
                    form.classList.add('hide');
                    btn.className = 'btn btn-secondary';
                }
            });
        }

        async function handleDeposit(e) {
            e.preventDefault();
            const acct = document.getElementById('depAccount').value;
            const amt = document.getElementById('depAmount').value;

            try {
                const response = await fetch('/operations/deposit', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `accountNumber=${encodeURIComponent(acct)}&amount=${encodeURIComponent(amt)}`
                });
                const data = await response.json();
                if (data.success) {
                    showGlobalAlert('globalSuccess', data.message);
                    document.getElementById('depositForm').reset();
                    setTimeout(() => { refreshAccounts(); pollMetrics(); }, 500);
                } else {
                    showGlobalAlert('globalError', data.error || data.message || 'Deposit failed.', false);
                }
            } catch (err) {
                showGlobalAlert('globalError', 'API server unreachable.', false);
            }
        }

        async function handleWithdraw(e) {
            e.preventDefault();
            const acct = document.getElementById('withAccount').value;
            const amt = document.getElementById('withAmount').value;

            try {
                const response = await fetch('/operations/withdraw', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `accountNumber=${encodeURIComponent(acct)}&amount=${encodeURIComponent(amt)}`
                });
                const data = await response.json();
                if (data.success) {
                    showGlobalAlert('globalSuccess', data.message);
                    document.getElementById('withdrawForm').reset();
                    setTimeout(() => { refreshAccounts(); pollMetrics(); }, 500);
                } else {
                    showGlobalAlert('globalError', data.error || data.message || 'Withdrawal failed.', false);
                }
            } catch (err) {
                showGlobalAlert('globalError', 'API server unreachable.', false);
            }
        }

        async function handleTransfer(e) {
            e.preventDefault();
            const src = document.getElementById('transSource').value;
            const dest = document.getElementById('transTarget').value;
            const amt = document.getElementById('transAmount').value;

            try {
                const response = await fetch('/operations/transfer', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `sourceAccount=${encodeURIComponent(src)}&targetAccount=${encodeURIComponent(dest)}&amount=${encodeURIComponent(amt)}`
                });
                const data = await response.json();
                if (data.success) {
                    showGlobalAlert('globalSuccess', data.message);
                    document.getElementById('transferForm').reset();
                    setTimeout(() => { refreshAccounts(); pollMetrics(); }, 500);
                } else {
                    showGlobalAlert('globalError', data.error || data.message || 'Transfer failed.', false);
                }
            } catch (err) {
                showGlobalAlert('globalError', 'API server unreachable.', false);
            }
        }
    </script>
</body>
</html>
